name: edubranch-ai

# ==============================================================================
# EduBranch-AI — Development & Integration Stack
# ==============================================================================
# Services:
#   - PostgreSQL 16 + pgvector   (business data + vector embeddings)
#   - Redis 7                    (caching, session store)
#   - MinIO                      (object storage for PDF/DOCX materials)
#   - AI Service                 (Python 3.12 + FastAPI internal RAG/LLM)
#   - Backend Gateway            (NestJS 10 + Node.js 20 LTS)
#   - Frontend Web App           (React 19 + Vite + TailwindCSS v4 + Nginx)
#
# Usage:
#   docker compose up -d          # start all services in background
#   docker compose up --build     # rebuild and start all services
#   docker compose down           # stop all services
#   docker compose down -v        # stop and remove volumes (data loss!)
# ==============================================================================

services:

  # ============================================================================
  # PostgreSQL 16 + pgvector
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edubranch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edubranch_ai}
      POSTGRES_USER: ${POSTGRES_USER:-edubranch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edubranch} -d ${POSTGRES_DB:-edubranch_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edubranch_network

  # ============================================================================
  # Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: edubranch_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-changeme_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edubranch_network

  # ============================================================================
  # MinIO — Object Storage for Teaching Materials (PDF/DOCX)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: edubranch_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edubranch_network

  # ============================================================================
  # AI Service (Python 3.12 + FastAPI — Internal Only)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: edubranch_ai_service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-edubranch_ai}
      POSTGRES_USER: ${POSTGRES_USER:-edubranch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-changeme_internal_ai_service_api_key}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme_minio_password}
      MINIO_BUCKET_MATERIALS: ${MINIO_BUCKET_MATERIALS:-edubranch-materials}
      RAG_CHUNK_SIZE: 512
      RAG_CHUNK_OVERLAP: 64
      RAG_TOP_K: 5
      CHALLENGE_SUPPORT_MAX_ROUNDS: 2
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - edubranch_network

  # ============================================================================
  # Backend Gateway (NestJS 10 + Node.js 20 LTS)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edubranch_backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-edubranch_ai}
      POSTGRES_USER: ${POSTGRES_USER:-edubranch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
      DB_POOL_MIN_SIZE: 5
      DB_POOL_MAX_SIZE: 20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_password}
      JWT_SECRET: ${JWT_SECRET:-changeme_generate_a_strong_random_jwt_secret_min_64_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-changeme_internal_ai_service_api_key}
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio_password}
      MINIO_BUCKET_MATERIALS: ${MINIO_BUCKET_MATERIALS:-edubranch-materials}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
      MAX_UPLOAD_SIZE_MB: 50
      CHALLENGE_SUPPORT_MAX_ROUNDS: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - edubranch_network

  # ============================================================================
  # Frontend Web App (React 19 + Vite + TailwindCSS v4 + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: edubranch_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edubranch_network

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
    # Preserve the existing PostgreSQL data volume while the service identity
    # moves to EduBranch-AI. Do not let Compose create a fresh empty database.
    name: casetree-ai_postgres_data
  redis_data:
    driver: local
  minio_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  edubranch_network:
    driver: bridge
    name: edubranch_network

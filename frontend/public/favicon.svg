<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>EduBranch-AI — Cap, Book &amp; Branch</title>
<desc>Editable vector interpretation of the supplied graduation-cap, learning-path and open-book icon. Each logical part is grouped for editing in Figma.</desc>
<defs>
 <linearGradient id="outerBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07153D"/><stop offset="1" stop-color="#020B27"/></linearGradient>
 <linearGradient id="tileBg" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#142B68"/><stop offset=".5" stop-color="#071945"/><stop offset="1" stop-color="#06143B"/></linearGradient>
 <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C6DDFD"/></linearGradient>
 <linearGradient id="pageRight" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEAFF"/></linearGradient>
 <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5F9FFF"/><stop offset="1" stop-color="#1762E7"/></linearGradient>
 <linearGradient id="pathGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C8DEFF"/></linearGradient>
 <linearGradient id="leftNode" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9E9FF"/><stop offset="1" stop-color="#85B9FF"/></linearGradient>
 <radialGradient id="goldGlow"><stop stop-color="#FFCF4C" stop-opacity=".38"/><stop offset="1" stop-color="#FFBE35" stop-opacity="0"/></radialGradient>
 <linearGradient id="goldNode" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE17A"/><stop offset="1" stop-color="#FFB51F"/></linearGradient>
 <linearGradient id="capTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5AA6FF"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
 <linearGradient id="capSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2E6BE3"/><stop offset="1" stop-color="#112C74"/></linearGradient>
</defs>
<rect id="Rounded-App-Background" width="1024" height="1024" rx="190" fill="url(#tileBg)"/>
<g id="Background-Highlights" opacity=".25">
 <path d="M0 190 C180 145 300 80 370 0 L0 0 Z" fill="#3159B7"/>
 <path d="M1024 770 C920 830 860 930 845 1024 L1024 1024 Z" fill="#173A91"/>
</g>

    <g id="Icon-Artwork" >
      <g id="Book-Pages">
        <path id="Book-Left-Page" d="M132 675 C258 658 396 676 512 790 L512 890 C389 792 255 774 132 783 Z" fill="url(#pageLeft)"/>
        <path id="Book-Right-Page" d="M892 675 C766 658 628 676 512 790 L512 890 C635 792 769 774 892 783 Z" fill="url(#pageRight)"/>
        <path id="Book-Left-Blue-Edge" d="M132 760 C271 748 411 781 512 860 L512 890 C389 792 255 774 132 783 Z" fill="url(#blueEdge)"/>
        <path id="Book-Right-Blue-Edge" d="M892 760 C753 748 613 781 512 860 L512 890 C635 792 769 774 892 783 Z" fill="url(#blueEdge)"/>
      </g>
      <g id="Graduation-Cap">
        <path id="Cap-Base" d="M345 228 L512 300 L679 228 L674 328 C575 382 449 382 350 328 Z" fill="url(#capSide)"/>
        <path id="Cap-Top" d="M512 125 L795 245 L512 365 L229 245 Z" fill="url(#capTop)"/>
        <path id="Cap-Tassel-Line" d="M784 247 L784 330" stroke="#55B5FF" stroke-width="17" stroke-linecap="round" fill="none"/>
        <path id="Cap-Tassel-End" d="M766 329 C766 311 802 311 802 329 L802 364 C802 381 766 381 766 364 Z" fill="url(#capTop)"/>
      </g>
<g id="Decision-Path" fill="none" stroke="url(#pathGradient)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
        <path id="Central-Stem" d="M512 360 L512 495"/>
        <path id="Left-Branch" d="M512 495 C472 535 408 548 350 548"/>
        <path id="Right-Branch" d="M512 495 C572 530 631 548 714 548"/>
        <path id="Book-Connection" d="M512 495 L512 680"/>
      </g>
      <g id="Decision-Nodes">
        <circle id="Start-Node-Outer" cx="512" cy="300" r="66" fill="#F7FAFF"/>
        <circle id="Start-Node-Inner" cx="512" cy="300" r="36" fill="#0A1B4A"/>
        <circle id="Left-Outcome-Node" cx="350" cy="548" r="46" fill="url(#leftNode)"/>
        <circle id="Right-Outcome-Glow" cx="714" cy="548" r="94" fill="url(#goldGlow)"/>
        <circle id="Right-Outcome-Node" cx="714" cy="548" r="49" fill="url(#goldNode)"/>
      </g>
      
    </g>
</svg>